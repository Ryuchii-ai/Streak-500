<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1280" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg400" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ebd7fb" />
      <stop offset="100%" stop-color="#e0bbf7" />
    </linearGradient>

    <!-- Flame Body Gradient -->
    <linearGradient id="flameGrad400" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed" />
      <stop offset="60%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- Flame Core -->
    <linearGradient id="flameCore400" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#fdf4ff" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>

    <!-- 3D Number 400 Gradient -->
    <linearGradient id="numGrad400" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9333ea" />
      <stop offset="50%" stop-color="#c026d3" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>

    <clipPath id="avatarClipLeft400">
      <circle cx="210" cy="400" r="62" />
    </clipPath>
    <clipPath id="avatarClipRight400">
      <circle cx="510" cy="400" r="62" />
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="720" height="1280" fill="url(#bg400)" />

  <!-- Confetti Pieces -->
  <g opacity="0.85">
    <rect x="110" y="230" width="18" height="8" rx="4" transform="rotate(30 110 230)" fill="#fb923c" />
    <rect x="590" y="240" width="16" height="8" rx="4" transform="rotate(-30 590 240)" fill="#38bdf8" />
    <rect x="250" y="320" width="22" height="7" rx="3" transform="rotate(-40 250 320)" fill="#ec4899" />
    <rect x="490" y="330" width="20" height="8" rx="4" transform="rotate(45 490 330)" fill="#a855f7" />
    <circle cx="170" cy="450" r="5" fill="#e11d48" />
    <circle cx="610" cy="460" r="6" fill="#0ea5e9" />
    <path d="M 180 500 Q 200 480 220 505" stroke="#f97316" stroke-width="6" fill="none" stroke-linecap="round" />
    <path d="M 520 510 Q 540 490 560 515" stroke="#38bdf8" stroke-width="6" fill="none" stroke-linecap="round" />
  </g>

  <!-- Header Text -->
  <g id="header-text" transform="translate(36, 120)">
    <text x="0" y="0" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="900" font-size="40" fill="#9333ea" letter-spacing="-0.5">Lencana Runtunan telah</text>
    <text x="0" y="48" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="900" font-size="40" fill="#9333ea" letter-spacing="-0.5">ditingkatkan</text>
    <text x="0" y="125" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="900" font-size="64" fill="#09090b" letter-spacing="-1">@lauu</text>
  </g>

  <!-- Ground Shadow under Flame Mascot -->
  <ellipse cx="360" cy="540" rx="90" ry="12" fill="#c49bd6" opacity="0.6" />

  <!-- Running Mascot Legs & Arms -->
  <g stroke="#09090b" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M 330 490 L 305 530 L 270 525" />
    <path d="M 390 490 L 415 520 L 440 515" />
    <path d="M 300 420 L 260 410 L 230 415" />
    <path d="M 420 420 L 460 410 L 490 415" />
  </g>

  <!-- Flame Mascot Body -->
  <g id="flame-mascot">
    <path d="M 360 270 
             C 330 310, 315 340, 305 380
             C 290 430, 310 490, 360 495
             C 410 490, 430 430, 415 380
             C 405 340, 390 310, 360 270 Z"
          fill="url(#flameGrad400)" stroke="#09090b" stroke-width="8" stroke-linejoin="round" />
    
    <path d="M 360 370 
             C 345 395, 340 415, 340 435
             C 340 460, 350 475, 360 475
             C 370 475, 380 460, 380 435
             C 380 415, 375 395, 360 370 Z"
          fill="url(#flameCore400)" opacity="0.9" />
  </g>

  <!-- Left Avatar (Guy overlooking mountains) -->
  <g id="left-avatar">
    <circle cx="210" cy="400" r="66" fill="#09090b" />
    <g clip-path="url(#avatarClipLeft400)">
      <rect x="140" y="330" width="140" height="140" fill="#38bdf8" />
      <path d="M 140 410 Q 180 380 230 405 Q 260 395 280 415 L 280 470 L 140 470 Z" fill="#ca8a04" />
      <path d="M 140 425 Q 170 410 210 420 Q 250 410 280 430 L 280 470 L 140 470 Z" fill="#713f12" />
      <ellipse cx="210" cy="385" rx="14" ry="14" fill="#18181b" />
      <path d="M 218 383 Q 230 384 233 388 Q 225 390 218 389 Z" fill="#18181b" />
      <path d="M 188 440 L 195 405 Q 210 398 225 405 L 232 440 Z" fill="#27272a" />
      <path d="M 200 405 L 200 435" stroke="#52525b" stroke-width="3" />
      <path d="M 220 405 L 220 435" stroke="#52525b" stroke-width="3" />
    </g>
    <circle cx="210" cy="400" r="62" fill="none" stroke="#09090b" stroke-width="7" />
  </g>

  <!-- Right Avatar (Girl @lauu) -->
  <g id="right-avatar">
    <circle cx="510" cy="400" r="66" fill="#09090b" />
    <g clip-path="url(#avatarClipRight400)">
      <rect x="440" y="330" width="140" height="140" fill="#f5ebe0" />
      <path d="M 475 360 Q 510 340 545 360 Q 560 410 550 460 L 470 460 Q 460 410 475 360 Z" fill="#1c1917" />
      <path d="M 490 420 L 480 460 L 540 460 L 530 420 Z" fill="#fed7aa" />
      <path d="M 475 440 Q 510 455 545 440 L 548 465 L 472 465 Z" fill="#ffffff" />
      <ellipse cx="510" cy="392" rx="22" ry="26" fill="#ffedd5" />
      <ellipse cx="503" cy="390" rx="3.5" ry="2.5" fill="#292524" />
      <ellipse cx="519" cy="390" rx="3.5" ry="2.5" fill="#292524" />
      <path d="M 506 405 Q 511 409 516 405" stroke="#e11d48" stroke-width="2.5" fill="none" stroke-linecap="round" />
      <path d="M 488 368 Q 502 385 498 420 Q 488 395 488 368 Z" fill="#1c1917" />
      <path d="M 532 368 Q 520 390 524 425 Q 534 395 532 368 Z" fill="#1c1917" />
    </g>
    <circle cx="510" cy="400" r="62" fill="none" stroke="#09090b" stroke-width="7" />
  </g>

  <!-- Comic Cloud Speech Bubble -->
  <g id="speech-bubble" transform="translate(0, 520)">
    <g stroke="#09090b" stroke-width="6" stroke-linecap="round">
      <line x1="610" y1="210" x2="640" y2="195" />
      <line x1="620" y1="235" x2="655" y2="220" />
      <line x1="70" y1="820" x2="45" y2="850" />
      <line x1="90" y1="835" x2="70" y2="865" />
    </g>

    <path d="M 360 80
             C 410 70, 460 85, 490 110
             C 540 95, 590 130, 610 175
             C 640 210, 650 260, 630 305
             C 660 350, 650 410, 615 450
             C 630 500, 600 550, 550 575
             C 520 610, 460 620, 410 610
             C 380 630, 330 630, 290 615
             C 240 630, 180 610, 150 570
             C 105 555, 80 505, 95 455
             C 65 415, 65 355, 95 315
             C 75 265, 95 210, 135 180
             C 150 130, 205 95, 255 105
             C 290 85, 330 75, 360 80 Z"
          fill="#ffffff" stroke="#09090b" stroke-width="9" stroke-linejoin="round" />

    <path d="M 380 80 L 395 10 L 415 85 Z" fill="#ffffff" stroke="#09090b" stroke-width="9" stroke-linejoin="round" />
    <path d="M 382 82 L 413 86" stroke="#ffffff" stroke-width="12" stroke-linecap="round" />

    <!-- Black Label Pill: "Hari obrolan yang sedang berlangsung" -->
    <g transform="translate(130, 115)">
      <rect x="0" y="0" width="135" height="110" rx="14" fill="#09090b" />
      <text x="14" y="28" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="900" font-size="19" fill="#ffffff">Hari</text>
      <text x="14" y="52" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="900" font-size="19" fill="#ffffff">obrolan</text>
      <text x="14" y="76" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="900" font-size="19" fill="#ffffff">yang</text>
      <text x="14" y="100" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="900" font-size="19" fill="#ffffff">sedang</text>
      
      <rect x="0" y="114" width="155" height="34" rx="10" fill="#09090b" />
      <text x="14" y="138" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="900" font-size="18" fill="#ffffff">berlangsung</text>
    </g>

    <!-- Giant 3D "400" -->
    <g transform="translate(360, 480)" text-anchor="middle">
      <text x="6" y="18" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="280" fill="#3b0764" stroke="#09090b" stroke-width="26" stroke-linejoin="round">400</text>
      <text x="4" y="12" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="280" fill="#581c87" stroke="#09090b" stroke-width="20" stroke-linejoin="round">400</text>
      <text x="0" y="0" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="280" fill="none" stroke="#09090b" stroke-width="22" stroke-linejoin="round">400</text>
      <text x="0" y="0" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="280" fill="url(#numGrad400)">400</text>
    </g>
  </g>

  <!-- Bottom Stats: 11,4 RB & 413 -->
  <g transform="translate(0, 890)">
    <!-- Left Stat: 11,4 RB -->
    <g transform="translate(100, 0)">
      <rect x="0" y="0" width="130" height="52" rx="10" fill="#09090b" />
      <text x="12" y="24" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="900" font-size="17" fill="#ffffff">Pesan</text>
      <text x="12" y="44" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="900" font-size="17" fill="#ffffff">terkirim</text>
      <g transform="translate(-5, 115)">
        <text x="4" y="6" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="88" fill="#3b0764" stroke="#09090b" stroke-width="12">11,4 RB</text>
        <text x="0" y="0" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="88" fill="#c026d3" stroke="#09090b" stroke-width="10">11,4 RB</text>
      </g>
      <path d="M 80 52 L 140 135" stroke="#09090b" stroke-width="6" />
    </g>

    <!-- Right Stat: 413 -->
    <g transform="translate(420, 10)">
      <rect x="0" y="0" width="165" height="52" rx="10" fill="#09090b" />
      <text x="12" y="24" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="900" font-size="17" fill="#ffffff">Hari</text>
      <text x="12" y="44" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="900" font-size="17" fill="#ffffff">pertemanan</text>
      <g transform="translate(10, 105)">
        <text x="4" y="6" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="94" fill="#3b0764" stroke="#09090b" stroke-width="12">413</text>
        <text x="0" y="0" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="94" fill="#c026d3" stroke="#09090b" stroke-width="10">413</text>
      </g>
      <path d="M 0 52 L -30 135" stroke="#09090b" stroke-width="6" />
    </g>
  </g>
</svg>
